name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
        include:
          # The oldest Linux runner, so the helper a release takes from it runs
          # on any glibc from 2.35 on.
          - os: ubuntu-22.04
            python: "3.12"
    steps:
      # SOEM is a submodule, pinned to the release the helper is built against.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The CiA 402 plugin, for the tests that drive the scripted ring's drive
      # through it (tests/test_with_cia402.py).
      - uses: actions/checkout@v7
        with:
          repository: davhodg/pycangui-cia402
          path: external/pycangui-cia402

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      # Both helpers -- over SOEM, and over the scripted ring the tests use --
      # and the C tests. MSVC on Windows (found with vswhere), gcc on Linux,
      # each with its warnings as errors.
      - name: Build the helper and run the C tests
        run: python build/build.py

      # Qt needs a display. The tests ask for the offscreen platform, but
      # Linux runners also lack the X libraries Qt links against.
      - name: Install Qt's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          PYCANGUI_CIA402: external/pycangui-cia402
        run: python -m pytest -q -n auto

      # On a tag, the helper this job built and tested goes into the release:
      # Windows from here, Linux from the oldest runner.
      - name: Keep the helper for the release
        if: startsWith(github.ref, 'refs/tags/v') && (matrix.os == 'windows-latest' || matrix.os == 'ubuntu-22.04')
        uses: actions/upload-artifact@v7
        with:
          name: helper-${{ runner.os }}
          path: |
            ethercat/bin/ecat_helper
            ethercat/bin/ecat_helper.exe
          if-no-files-found: error

  # A tag v<VERSION> makes a GitHub release with the zip pycangui installs,
  # both helpers in it. plugins.json is then written from that zip
  # (build/pack.py --list) and committed.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v7
        with:
          pattern: helper-*
          path: ethercat/bin
          merge-multiple: true

      - name: Pack
        run: python build/pack.py "${{ github.ref_name }}"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
